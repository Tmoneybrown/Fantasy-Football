<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1a33">
<meta name="description" content="Bye week planner, lineup lock check, IR stash alerts, and free agent radar for six fantasy football leagues.">
<title>Fantasy Football</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1a33;
    --card: #13284a;
    --line: #22406e;
    --gold: #d4af37;
    --text: #e8edf5;
    --muted: #9fb0c8;
    --green: #2ecc71;
    --orange: #f5a623;
    --red: #e74c3c;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    line-height: 1.45;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 18px max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  h1 { color: var(--gold); font-size: 24px; margin: 0; }
  h2 {
    color: var(--gold);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 6px;
    margin: 30px 0 10px;
    letter-spacing: 1px;
    font-size: 16px;
  }
  h3 { margin: 8px 0 0; font-size: 18px; }
  a { color: var(--gold); text-underline-offset: 2px; }
  a:visited { color: var(--gold); }
  a:hover { color: #f0d78c; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .m { color: var(--muted); font-size: 13px; }
  .c {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .rw {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px 12px;
    flex-wrap: wrap;
  }
  .league { color: var(--gold); }
  .st-out { color: var(--red); font-weight: 700; }
  .st-q { color: var(--orange); font-weight: 700; }
  .st-ok { color: var(--green); font-weight: 700; }
  .pending { color: var(--orange); font-weight: 700; }
  .day { color: var(--gold); font-weight: 700; font-size: 13px; letter-spacing: .03em; }
  .leagues {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
    list-style: none;
    padding: 0;
    margin: 14px 0 0;
  }
  .leagues li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .key { margin: 14px 0 0; font-size: 14px; }
  .routines { list-style: none; margin: 0; padding: 0; }
  .c p { margin: 8px 0 0; }
  .shot img {
    display: block;
    width: 100%;
    height: auto;
    margin-top: 10px;
    border-radius: 8px;
    background: #0a1528;
  }
  .shot a { display: block; text-decoration: none; }
  footer {
    border-top: 1px solid var(--gold);
    margin-top: 28px;
    padding-top: 10px;
    color: var(--muted);
    font-size: 12px;
  }
  footer p { margin: 0; }
  .report { margin-top: 8px; }
  .report-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px 12px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--gold);
    margin: 22px 0 10px;
    padding-bottom: 6px;
  }
  .report-head h2 { border: 0; margin: 0; padding: 0; }
  .report-head .updated { margin: 0; }
  .sub { margin: 6px 0 10px; }
  .league-item { margin: 0 0 8px; }
  .league-btn {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .league-btn:hover { border-color: var(--gold); }
  .league-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .league-btn[aria-expanded="true"] {
    border-radius: 10px 10px 0 0;
    border-bottom-color: transparent;
  }
  .league-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .league-btn .summary {
    margin-left: auto;
    color: var(--muted);
    font-size: 13px;
    text-align: right;
    max-width: 48%;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
    margin-top: 6px;
    background: var(--muted);
  }
  .dot.red { background: #ef4444; }
  .dot.orange { background: var(--orange); }
  .dot.green { background: var(--green); }
  .chev {
    color: var(--gold);
    margin-top: 2px;
    transition: transform .15s ease;
  }
  .league-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .panel {
    background: #0e2244;
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 10px 10px;
    padding: 8px 12px 12px;
    margin-top: -1px;
  }
  .panel[hidden] { display: none; }
  .panel h4 {
    margin: 12px 0 6px;
    font-size: 13px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .panel h4:first-child { margin-top: 4px; }
  .panel p { margin: 6px 0 0; }
  .detail {
    background: var(--card);
    border: 1px solid var(--line);
    border-left-width: 3px;
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
  }
  .sev-red { border-left-color: #ef4444; }
  .sev-orange { border-left-color: var(--orange); }
  .sev-green { border-left-color: var(--green); }
  .sev-red .wk { color: #ef4444; }
  .sev-orange .wk { color: var(--orange); }
  .sev-green .wk { color: var(--green); }
  .tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .tag.red { color: #ef4444; }
  .tag.orange { color: var(--orange); }
  .tag.green { color: var(--green); }
  .plist { list-style: none; margin: 0; padding: 0; }
  .plist li {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    align-items: baseline;
    padding: 6px 0;
    border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .meta { color: var(--muted); font-size: 13px; }
  .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .who .dot { margin-top: 0; }
  @media (max-width: 640px) {
    .league-btn { flex-wrap: wrap; }
    .league-btn .summary {
      flex: 1 0 100%;
      margin-left: 20px;
      max-width: none;
      text-align: left;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Fantasy Football</h1>

  <section class="report" id="bye-planner" data-kind="bye" data-file="data/bye_planner.json">
    <div class="report-head">
      <h2>Bye Week Planner</h2>
      <p class="m updated">Loading…</p>
    </div>
    <p class="m sub"></p>
    <div class="mount"></div>
  </section>

  <section class="report" id="lock-check" data-kind="lock" data-file="data/lock_check.json">
    <div class="report-head">
      <h2>Lineup Lock Check</h2>
      <p class="m updated">Loading…</p>
    </div>
    <p class="m sub"></p>
    <div class="mount"></div>
  </section>

  <section class="report" id="ir-stash" data-kind="ir" data-file="data/ir_stash.json">
    <div class="report-head">
      <h2>IR Stash Alerts</h2>
      <p class="m updated">Loading…</p>
    </div>
    <p class="m sub"></p>
    <div class="mount"></div>
  </section>

  <section class="report" id="fa-radar" data-kind="fa" data-file="data/free_agents.json">
    <div class="report-head">
      <h2>Free Agent Radar</h2>
      <p class="m updated">Loading…</p>
    </div>
    <p class="m sub"></p>
    <div class="mount"></div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
